apiVersion: apps/v1
kind: Deployment
metadata:
  name: porter-shim
  namespace: porter-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: porter-shim }
  template:
    metadata: { labels: { app: porter-shim } }
    spec:
      containers:
      - name: shim
        image: ghcr.io/your-org/porter-shim:latest
        ports: [{ containerPort: 8081 }]
---
apiVersion: v1
kind: Service
metadata:
  name: porter-shim
  namespace: porter-system
spec:
  selector: { app: porter-shim }
  ports:
  - name: http
    port: 80
    targetPort: 8081
