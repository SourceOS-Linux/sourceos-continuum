apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudshell-culler
  namespace: devtools
spec:
  replicas: 1
  selector:
    matchLabels: { app: cloudshell-culler }
  template:
    metadata: { labels: { app: cloudshell-culler } }
    spec:
      serviceAccountName: cloudshell-culler
      containers:
      - name: culler
        image: ghcr.io/your-org/cloudshell-culler:latest
        env:
        - name: NAMESPACE
          value: devtools
        - name: IDLE_AFTER_MINUTES
          value: "60"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudshell-culler
  namespace: devtools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudshell-culler
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get","list","watch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudshell-culler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudshell-culler
subjects:
- kind: ServiceAccount
  name: cloudshell-culler
  namespace: devtools
