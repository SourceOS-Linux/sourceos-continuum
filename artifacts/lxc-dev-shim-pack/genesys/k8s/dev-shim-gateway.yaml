apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-shim-gateway
  namespace: porter-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: dev-shim-gateway }
  template:
    metadata: { labels: { app: dev-shim-gateway } }
    spec:
      containers:
      - name: gateway
        image: ghcr.io/your-org/dev-shim-gateway:latest
        ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: dev-shim-gateway
  namespace: porter-system
spec:
  selector: { app: dev-shim-gateway }
  ports:
  - name: http
    port: 80
    targetPort: 8080
