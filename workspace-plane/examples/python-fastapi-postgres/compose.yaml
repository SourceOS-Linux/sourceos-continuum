services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
    - uvicorn
    - app.main:app
    - --reload
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    environment:
      PORT: '8000'
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ledger
    ports:
    - 8000:8000
    volumes:
    - type: bind
      source: .
      target: /workspaces/ledger
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: ledger
    ports:
    - 5432:5432
    volumes:
    - pg-data:/var/lib/postgresql/data
volumes:
  pg-data: {}
networks:
  default:
    name: ledger-net
