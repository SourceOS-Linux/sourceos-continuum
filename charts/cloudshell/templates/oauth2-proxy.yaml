{{- if .Values.auth.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudshell.fullname" . }}-oauth2-proxy
  labels: { app.kubernetes.io/name: oauth2-proxy }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: oauth2-proxy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: oauth2-proxy }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: oauth2-proxy
        image: {{ .Values.image.oauth2Proxy | quote }}
        args:
        - --http-address=0.0.0.0:4180
        - --provider=oidc
        - --oidc-issuer-url={{ .Values.auth.oidcIssuerURL }}
        - --client-id=$(OAUTH2_PROXY_CLIENT_ID)
        - --client-secret=$(OAUTH2_PROXY_CLIENT_SECRET)
        - --cookie-secret=$(OAUTH2_PROXY_COOKIE_SECRET)
        - --cookie-name={{ .Values.auth.cookieName }}
        - --email-domain={{ join "," .Values.auth.emailDomains }}
        - --upstream=http://{{ include "cloudshell.fullname" . }}-gateway.{{ .Release.Namespace }}.svc.cluster.local
        - --reverse-proxy=true
        - --set-authorization-header=true
        - --pass-user-headers=true
        - --pass-authorization-header=true
        - --skip-provider-button=true
        {{- range .Values.auth.extraArgs }}
        - {{ . | quote }}
        {{- end }}
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom: { secretKeyRef: { name: {{ .Values.auth.existingSecretName | quote }}, key: client-id } }
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom: { secretKeyRef: { name: {{ .Values.auth.existingSecretName | quote }}, key: client-secret } }
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom: { secretKeyRef: { name: {{ .Values.auth.existingSecretName | quote }}, key: cookie-secret } }
        ports:
        - name: http
          containerPort: 4180
        resources: {{- toYaml .Values.resources.oauth2Proxy | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
          runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudshell.fullname" . }}-oauth2-proxy
spec:
  selector: { app.kubernetes.io/name: oauth2-proxy }
  ports: [{ name: http, port: 80, targetPort: 4180 }]
{{- end }}
