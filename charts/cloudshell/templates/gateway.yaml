apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudshell.fullname" . }}-gateway-nginx
data:
  default.conf: |
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    server {
      listen 8080;

      location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
      }

      {{- if .Values.spawner.enabled }}
      location = /launch {
        proxy_set_header X-Auth-Request-User $http_x_auth_request_user;
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_pass http://{{ include "cloudshell.fullname" . }}-spawner.{{ .Release.Namespace }}.svc.cluster.local/launch;
      }
      {{- end }}

      location ~ "^/u/(?<uid>u-[a-f0-9]{10})/(.*)$" {
        set $svc "$uid.{{ .Release.Namespace }}.svc.cluster.local";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        rewrite "^/u/(?<uid2>u-[a-f0-9]{10})/(.*)$" /$2 break;
        proxy_pass http://$svc;
      }

      location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://{{ include "cloudshell.fullname" . }}-shared.{{ .Release.Namespace }}.svc.cluster.local;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudshell.fullname" . }}-gateway
  labels: { app.kubernetes.io/name: cloudshell-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: cloudshell-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cloudshell-gateway }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: nginx
        image: {{ .Values.image.gateway | quote }}
        ports: [{ name: http, containerPort: 8080 }]
        volumeMounts:
        - name: cfg
          mountPath: /etc/nginx/conf.d
        resources: {{- toYaml .Values.resources.gateway | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
          runAsNonRoot: true
      volumes:
      - name: cfg
        configMap:
          name: {{ include "cloudshell.fullname" . }}-gateway-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudshell.fullname" . }}-gateway
spec:
  selector: { app.kubernetes.io/name: cloudshell-gateway }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
