{{- if .Values.rbac.namespaceScoped }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudshell-view
rules:
- apiGroups: ["", "apps", "batch", "extensions"]
  resources: ["pods","pods/log","services","deployments","replicasets","jobs","cronjobs","configmaps"]
  verbs: ["get","list","watch"]
{{- end }}
